name: Release App Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           
          token: ${{ secrets.GH_PAT }}  
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get release version
        id: version
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$CURRENT" != *"-SNAPSHOT" ]]; then
            echo "Error: Current version is not a SNAPSHOT"
            exit 1
          fi
          RELEASE=${CURRENT%-SNAPSHOT}
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Update to release version
        run: |
          mvn -B versions:set -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false
          mvn -B versions:commit

      - name: Commit release version
        run: |
          git add pom.xml
          git commit -m "chore: release version ${{ steps.version.outputs.release }}"

      - name: Create release tag
        run: git tag -a "v${{ steps.version.outputs.release }}" -m "Release version ${{ steps.version.outputs.release }}"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn clean package -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Rename JAR to app.jar
        run: |
          mv target/*.jar target/app.jar
          ls -lh target/app.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/doda25-team9/app:${{ steps.version.outputs.release }}
            ghcr.io/doda25-team9/app:latest

      - name: Bump to next development version
        run: |
          mvn -B build-helper:parse-version versions:set \
            -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion}-SNAPSHOT \
            -DgenerateBackupPoms=false
          mvn -B versions:commit

      - name: Commit development version
        run: |
          git add pom.xml
          git commit -m "chore: bump to next development version [skip ci]"

      - name: Push changes
        run: |
          git push origin main
          git push origin --tags